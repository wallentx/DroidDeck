name: Build experimental Box64
on:
  push:
    paths:
      - 'tools/box64/**'
      - '.github/workflows/build-box64.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install probe compiler
        run: sudo apt-get update && sudo apt-get install -y clang lld
      - name: Compare with native x86-64 Linux
        run: |
          bash tools/box64/tests/build.sh out/probes
          timeout 15 out/probes/control
          timeout 15 out/probes/int80
          for mode in disk memfd unlinked; do
            timeout 15 out/probes/fd-load "$PWD/out/probes/module.so" "$mode"
          done
  box64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    needs: native-reference
    steps:
      - uses: actions/checkout@v7
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build gcc g++ gcc-x86-64-linux-gnu python3 clang lld zstd
      - name: Build pinned experimental component
        run: bash tools/box64/build.sh out/box64
      - name: Check translated syscalls
        env:
          BOX64_NORCFILES: '1'
          BOX64_LOG: '1'
          X86_CC: x86_64-linux-gnu-gcc
        run: |
          bash tools/box64/tests/build.sh out/probes
          timeout 20 out/box64/box64 out/probes/control
          timeout 20 out/box64/box64 out/probes/int80
          BOX64_DYNAREC=0 timeout 20 out/box64/box64 out/probes/int80
          mkdir -p out/private-memfd
          chmod 700 out/private-memfd
          for mode in disk memfd unlinked; do
            timeout 20 out/box64/box64 out/probes/fd-load "$PWD/out/probes/module.so" "$mode"
          done
          DROIDDECK_BOX64_MEMFD_DIR="$PWD/out/private-memfd" DROIDDECK_BOX64_MEMFD_FORCE_FILE=1 \
            timeout 20 out/box64/box64 out/probes/fd-load "$PWD/out/probes/module.so" memfd
          DROIDDECK_BOX64_MEMFD_DIR=/tmp DROIDDECK_BOX64_MEMFD_FORCE_FILE=1 \
            timeout 20 out/box64/box64 out/probes/fd-load "$PWD/out/probes/module.so" bad-directory
      - uses: actions/upload-artifact@v7
        with:
          name: experimental-box64
          path: |
            out/box64
            out/probes
          if-no-files-found: error
